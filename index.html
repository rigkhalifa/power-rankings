<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draft power rankings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF8F4;
    --ink: #1C1A17;
    --ink-muted: #8A8478;
    --divider: #E4DFD6;
    --accent: #2F4A3C;
    --trophy: #B8860B;
    --tier-good: #2F4A3C;
    --tier-mid: #4A6B8A;
    --tier-bad: #B5533C;
    --track: #EDE9E1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Source Serif 4', serif;
  }
  .page { max-width: 640px; margin: 0 auto; padding: 44px 24px 70px; }
  .masthead h1 { font-weight: 600; font-size: 30px; margin: 0 0 8px; letter-spacing: -0.2px; }
  .masthead p { font-style: italic; font-size: 15px; color: var(--ink-muted); margin: 0 0 20px; }
  .masthead .rule { border: none; border-top: 1px solid var(--ink); margin: 0; }

  .row-btn { all: unset; cursor: pointer; display: block; width: 100%; }
  .row {
    display: grid;
    grid-template-columns: 52px 1fr 20px;
    align-items: baseline;
    gap: 16px;
    padding: 18px 4px;
    border-bottom: 1px solid var(--divider);
    border-left: 2px solid transparent;
  }
  .row.r1 { border-left-color: var(--accent); padding-left: 14px; }
  .rank { font-family: 'IBM Plex Mono', monospace; font-size: 18px; color: var(--ink-muted); text-align: right; }
  .row.r1 .rank { color: var(--ink); font-weight: 500; }
  .team-name { font-size: 18px; font-weight: 500; }
  .row.r1 .team-name { font-weight: 600; font-size: 19px; }
  .trophy { color: var(--trophy); font-size: 14px; margin-left: 6px; }
  .chev { font-family: 'IBM Plex Mono', monospace; color: var(--ink-muted); font-size: 14px; align-self: center; transition: transform 0.15s; }
  .chev.open { transform: rotate(90deg); }

  .panel { display: none; padding: 6px 4px 22px 4px; border-bottom: 1px solid var(--divider); }
  .pos-row { display: grid; grid-template-columns: 64px 1fr 40px; align-items: center; gap: 10px; padding: 5px 0; }
  .pos-label { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink-muted); }
  .pos-track { height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; }
  .pos-fill { height: 100%; border-radius: 4px; }
  .pos-fill.good { background: var(--tier-good); }
  .pos-fill.mid { background: var(--tier-mid); }
  .pos-fill.bad { background: var(--tier-bad); }
  .pos-rank { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink-muted); text-align: right; }
  .no-data { font-size: 13px; color: var(--ink-muted); font-style: italic; padding: 8px 0; }

  .digest { margin-top: 48px; }
  .digest h2 { font-weight: 600; font-size: 22px; margin: 0 0 4px; }
  .digest .sub { font-style: italic; font-size: 14px; color: var(--ink-muted); margin: 0 0 20px; }
  .digest-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 24px 20px; }
  .digest-card h3 { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 500; color: var(--ink-muted); margin: 0 0 10px; text-transform: uppercase; letter-spacing: 0.5px; }
  .digest-card ol { list-style: none; margin: 0; padding: 0; }
  .digest-card li { font-size: 14px; padding: 4px 0; border-bottom: 1px solid var(--divider); }
  .digest-card li:last-child { border-bottom: none; }
  .digest-card .n { font-family: 'IBM Plex Mono', monospace; color: var(--ink-muted); margin-right: 6px; }

  .trophy-row-btn { all: unset; cursor: pointer; display: block; width: 100%; }
  .trophy-row {
    display: grid;
    grid-template-columns: 1fr auto 20px;
    align-items: center;
    gap: 12px;
    padding: 14px 4px;
    border-bottom: 1px solid var(--divider);
  }
  .trophy-team { font-size: 16px; font-weight: 500; }
  .trophy-owner { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink-muted); margin-left: 6px; }
  .trophy-count { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--trophy); white-space: nowrap; }
  .trophy-panel { display: none; padding: 4px 4px 16px 4px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--ink-muted); border-bottom: 1px solid var(--divider); }

  .empty, .error { padding: 40px 4px; text-align: center; color: var(--ink-muted); font-family: 'IBM Plex Mono', monospace; font-size: 14px; }
</style>
</head>
<body>
  <div class="page">
    <div class="masthead">
      <h1>Draft power rankings</h1>
      <p>Based on preseason roster grades &mdash; live rankings begin after Week 1</p>
      <hr class="rule">
    </div>
    <div id="list">Loading&hellip;</div>

    <div class="digest">
      <h2>Position digest</h2>
      <p class="sub">Top 3 teams per position, preseason</p>
      <div id="digest-grid" class="digest-grid"></div>
    </div>

    <div class="digest">
      <h2>Trophy case</h2>
      <p class="sub">League championship history, 2012&ndash;2025</p>
      <div id="trophy-list"></div>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbzAm-9Glh6ylCSZoq28hBOM79lHr07Zlcv4TGJjW59ugeJbcV1PXlQpFgcaNv4fU84L/exec';
    const CHAMPION = 'Ban defense & kickers';
    const POS_ORDER = ['TE', 'K', 'DST', 'QB', 'RB', 'WR', 'FLEX', 'STARTERS', 'BENCH'];
    const DIGEST_POS = ['QB', 'RB', 'WR', 'TE', 'FLEX'];

    function ordinal(n) {
      const s = ['th', 'st', 'nd', 'rd'], v = n % 100;
      return n + (s[(v - 20) % 10] || s[v] || s[0]);
    }
    function tier(rank) {
      if (rank <= 3) return 'good';
      if (rank <= 7) return 'mid';
      return 'bad';
    }
    function barWidth(rank) {
      return Math.round(((11 - rank) / 10) * 100) + '%';
    }

    function normalizeName(s) {
      return String(s).normalize('NFKC').trim().toLowerCase();
    }

    Promise.all([
      fetch(API_URL).then(r => r.json()),
      fetch('projections.json').then(r => r.json()),
      fetch('trophies.json').then(r => r.json())
    ]).then(([teams, projectionsRaw, trophies]) => {
      const projections = {};
      Object.keys(projectionsRaw).forEach(key => {
        projections[normalizeName(key)] = projectionsRaw[key];
      });
      renderList(teams, projections);
      renderDigest(projectionsRaw);
      renderTrophies(trophies);
    }).catch(err => {
      document.getElementById('list').innerHTML =
        '<div class="error">Couldn\'t load rankings. Try refreshing.</div>';
      console.error(err);
    });

    function renderList(teams, projections) {
      const list = document.getElementById('list');
      if (!teams.length) {
        list.innerHTML = '<div class="empty">No teams found.</div>';
        return;
      }

      list.innerHTML = teams.map((t, i) => {
        const proj = projections[normalizeName(t.name)];
        const panelBody = proj
          ? POS_ORDER.map(pos => {
              if (!(pos in proj)) return '';
              const rank = proj[pos];
              return `
                <div class="pos-row">
                  <div class="pos-label">${pos}</div>
                  <div class="pos-track"><div class="pos-fill ${tier(rank)}" style="width:${barWidth(rank)}"></div></div>
                  <div class="pos-rank">${ordinal(rank)}</div>
                </div>`;
            }).join('')
          : '<div class="no-data">No positional data yet.</div>';

        return `
          <div>
            <button class="row-btn" data-i="${i}">
              <div class="row ${t.rank === 1 ? 'r1' : ''}">
                <div class="rank">${t.rank}</div>
                <div class="team-name">${t.name}${t.name === CHAMPION ? ' <span class="trophy">&#127942;</span>' : ''}</div>
                <div class="chev" data-i="${i}">&rsaquo;</div>
              </div>
            </button>
            <div class="panel" data-i="${i}">${panelBody}</div>
          </div>`;
      }).join('');

      document.querySelectorAll('.row-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const i = btn.dataset.i;
          const panel = document.querySelector(`.panel[data-i="${i}"]`);
          const chev = document.querySelector(`.chev[data-i="${i}"]`);
          const open = panel.style.display === 'block';
          panel.style.display = open ? 'none' : 'block';
          chev.classList.toggle('open', !open);
        });
      });
    }

    function renderDigest(projections) {
      const grid = document.getElementById('digest-grid');
      grid.innerHTML = DIGEST_POS.map(pos => {
        const ranked = Object.entries(projections)
          .filter(([, p]) => pos in p)
          .sort((a, b) => a[1][pos] - b[1][pos])
          .slice(0, 3);
        const items = ranked.map(([name]) => `<li>${name}</li>`)
          .map((li, idx) => li.replace('<li>', `<li><span class="n">${idx + 1}.</span>`))
          .join('');
        return `<div class="digest-card"><h3>${pos}</h3><ol>${items}</ol></div>`;
      }).join('');
    }
    function renderTrophies(trophies) {
      const list = document.getElementById('trophy-list');
      const entries = Object.entries(trophies)
        .sort((a, b) => b[1].years.length - a[1].years.length);

      list.innerHTML = entries.map(([name, info], i) => {
        const count = info.years.length;
        const label = count === 0 ? 'No titles' : `${count} title${count > 1 ? 's' : ''} &#127942;`;
        const panelBody = count > 0
          ? info.years.slice().sort((a, b) => b - a).join(', ')
          : 'No championships yet.';
        return `
          <div>
            <button class="trophy-row-btn" data-t="${i}">
              <div class="trophy-row">
                <div class="trophy-team">${name}<span class="trophy-owner">${info.owner}</span></div>
                <div class="trophy-count">${label}</div>
                <div class="chev" data-t="${i}">&rsaquo;</div>
              </div>
            </button>
            <div class="trophy-panel" data-t="${i}">${panelBody}</div>
          </div>`;
      }).join('');

      document.querySelectorAll('.trophy-row-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const i = btn.dataset.t;
          const panel = document.querySelector(`.trophy-panel[data-t="${i}"]`);
          const chev = document.querySelector(`.chev[data-t="${i}"]`);
          const open = panel.style.display === 'block';
          panel.style.display = open ? 'none' : 'block';
          chev.classList.toggle('open', !open);
        });
      });
    }
  </script>
</body>
</html>
