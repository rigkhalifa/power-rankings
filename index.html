<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draft power rankings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF8F4;
    --ink: #1C1A17;
    --ink-muted: #8A8478;
    --divider: #E4DFD6;
    --accent: #2F4A3C;
    --trophy: #B8860B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Source Serif 4', serif;
  }
  .page { max-width: 640px; margin: 0 auto; padding: 44px 24px 60px; }
  .masthead h1 {
    font-weight: 600;
    font-size: 30px;
    margin: 0 0 8px;
    letter-spacing: -0.2px;
  }
  .masthead p {
    font-style: italic;
    font-size: 15px;
    color: var(--ink-muted);
    margin: 0 0 20px;
  }
  .masthead .rule { border: none; border-top: 1px solid var(--ink); margin: 0; }
  .row {
    display: grid;
    grid-template-columns: 52px 1fr;
    align-items: baseline;
    gap: 16px;
    padding: 18px 4px;
    border-bottom: 1px solid var(--divider);
    border-left: 2px solid transparent;
  }
  .row.r1 { border-left-color: var(--accent); padding-left: 14px; }
  .rank {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 18px;
    color: var(--ink-muted);
    text-align: right;
  }
  .row.r1 .rank { color: var(--ink); font-weight: 500; }
  .team-name {
    font-size: 18px;
    font-weight: 500;
  }
  .row.r1 .team-name { font-weight: 600; font-size: 19px; }
  .trophy { color: var(--trophy); font-size: 14px; margin-left: 6px; }
  .empty, .error { padding: 40px 4px; text-align: center; color: var(--ink-muted); font-family: 'IBM Plex Mono', monospace; font-size: 14px; }
</style>
</head>
<body>
  <div class="page">
    <div class="masthead">
      <h1>Draft power rankings</h1>
      <p>Based on preseason roster grades &mdash; live rankings begin after Week 1</p>
      <hr class="rule">
    </div>
    <div id="list">Loading&hellip;</div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbzAm-9Glh6ylCSZoq28hBOM79lHr07Zlcv4TGJjW59ugeJbcV1PXlQpFgcaNv4fU84L/exec';
    const CHAMPION = 'Ban defense & kickers';

    fetch(API_URL)
      .then(res => res.json())
      .then(teams => {
        const list = document.getElementById('list');
        if (!teams.length) {
          list.innerHTML = '<div class="empty">No teams found.</div>';
          return;
        }
        list.innerHTML = teams.map(t => `
          <div class="row ${t.rank === 1 ? 'r1' : ''}">
            <div class="rank">${t.rank}</div>
            <div class="team-name">${t.name}${t.name === CHAMPION ? ' <span class="trophy">&#127942;</span>' : ''}</div>
          </div>`).join('');
      })
      .catch(err => {
        document.getElementById('list').innerHTML =
          '<div class="error">Couldn\'t load rankings. Try refreshing.</div>';
        console.error(err);
      });
  </script>
</body>
</html>
